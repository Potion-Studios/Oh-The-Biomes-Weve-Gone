name: Release to CurseForge and Modrinth

on:
  workflow_run:
    workflows: ["Gradle Publish to Maven"]
    types:
      - completed

jobs:
  check-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
      version: ${{ steps.gate.outputs.version }}
      mc_version: ${{ steps.gate.outputs.mc_version }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        run: |
          VERSION=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)
          MC_VERSION=$(grep 'minecraft_version' gradle.properties | cut -d'=' -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" != *"-SNAPSHOT"* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Proceeding with release for version: $VERSION (MC $MC_VERSION)"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Snapshot detected ($VERSION). Skipping release."
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21
          cache: gradle

      - name: Configure Gradle secrets
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "${{ secrets.REPO_LOGIN }}" > ~/.gradle/gradle.properties
          echo "curseforge_token=${{ secrets.CURSEFORGE_TOKEN }}" >> ~/.gradle/gradle.properties
          echo "modrinth_token=${{ secrets.MODRINTH_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Publish Fabric
        run: ./gradlew :fabric:publishMod

      - name: Publish Forge
        run: ./gradlew :forge:publishMod

      - name: Extract Changelog Section
        id: changelog_reader
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          sed -n "/# $VERSION/,/#/p" CHANGELOG.md | grep -v "#" > release_notes.txt
          echo "Notes extracted:"
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: ${{ needs.check-version.outputs.version }}
          body_path: release_notes.txt
          files: |
            Fabric/build/libs/*.jar
            Forge/build/libs/*.jar
            !**/build/libs/*-dev-shadow.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version and add SNAPSHOT
        id: bump_version
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION" | cut -d'.' -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "Bumping version: $VERSION -> $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          sed -i "s/^mod_version=.*/mod_version=$NEXT_VERSION/" gradle.properties

      - name: Commit and push version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "${{ steps.bump_version.outputs.next_version }} Cycle"
          file_pattern: gradle.properties